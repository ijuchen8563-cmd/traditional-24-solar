        /* 基礎設置 */

            background-position: center;

        /* 月曆核心排版 */
        #calendarModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 50;
            background-color: rgba(28, 25, 23, 0.4);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 4px;
        }
        #calendarModal.active { display: flex; }

        .calendar-container {
            background: white;
            width: 100%;
            max-width: 80rem;
            height: 96vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        #calendarScrollWrapper {
            flex-grow: 1;
            overflow: auto;

            flex-direction: column;

            position: relative;
            -webkit-overflow-scrolling: touch;
        }

        #calendarContent {
            width: 100%;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            padding: 8px;
            transform-origin: top left;
            transition: transform 0.1s ease-out;

        .calendar-grid-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            flex-shrink: 0;
            text-align: center;
            font-weight: bold;
            color: #44403c;
        }

        .calendar-grid-body {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(6, 1fr);

            height: 100%;

        .calendar-day {
            border-bottom: 1px solid #f1f0ee;

    <script>
        const ICS_URL = "https://raw.githubusercontent.com/KaitoHH/24-jieqi-ics/master/23_solar_terms_2015-01-01_2050-12-31.ics";

        // 節氣詳細內容 - 全繁體校對
        const solarTermsInfo = {
            "立春": { season: "spring", icon: "🌱", desc: "春季的開始，大地萬物復甦。", detail: "「立」是開始的意思。立春過後，白晝變長，氣溫回暖。民間有咬春（吃春餅或蘿蔔）的習俗。" },
            "雨水": { season: "spring", icon: "🌧️", desc: "降雨開始增加，氣溫升高。", detail: "降雪減少，降雨增多。農民開始為春耕做準備，象徵著草木隨雨水而生長。" },
            "驚蟄": { season: "spring", icon: "⚡", desc: "春雷驚醒冬眠中的昆蟲。", detail: "驚蟄時節氣溫回升較快，春雷始鳴。古人認為雷聲喚醒了土裡的蟲子。" },
            "春分": { season: "spring", icon: "⚖️", desc: "晝夜等長，平分春季。", detail: "這一天太陽直射赤道。過了這一天，北半球白晝開始長於黑夜，是踏青的好時機。" },
            "清明": { season: "spring", icon: "🕯️", desc: "天氣清澈明亮，祭祖掃墓。", detail: "既是節氣也是節日。萬物吐故納新，氣溫轉暖，草夢繁茂。也是重要的祭祀與踏青節日。" },
            "穀雨": { season: "spring", icon: "🌾", desc: "雨水增多，利於穀類生長。", detail: "「雨生百穀」。這是春季最後一個節氣，此時田裡的秧苗最需要雨水的灌溉。" },
            "立夏": { season: "summer", icon: "☀️", desc: "夏季的開始，氣溫上升。", detail: "立夏表示萬物進入旺盛生長期。民間有喝「立夏茶」、吃「立夏飯」的習俗。" },
            "小滿": { season: "summer", icon: "🥣", desc: "穀類果實開始飽滿但未成熟。", detail: "「小滿」指穀物籽粒開始飽滿，但還未完全成熟，就像人生適度、不求全滿的智慧。" },
            "芒種": { season: "summer", icon: "🚜", desc: "有芒作物成熟，忙於播種。", detail: "諧音「忙著種」。這是農民最忙碌的時節，既要收穫又要播種，象徵辛勤的汗水。" },
            "夏至": { season: "summer", icon: "🗼", desc: "一年中白晝最長的一天。", detail: "這天太陽直射北回歸線。雖然白晝最長，但最熱的時候通常在之後的「三伏天」。" },
            "小暑": { season: "summer", icon: "💧", desc: "天氣開始炎熱。", detail: "小暑代表天氣剛開始熱，但還沒到最熱。這時民間有「食新」的習慣，品嚐新產的穀物。" },
            "大暑": { season: "summer", icon: "🔥", desc: "一年中最熱的時期。", detail: "大暑正值中伏前後，濕熱難耐。要多喝水、防暑降溫，民間也有吃仙草、吃鳳梨的習俗。" },
            "立秋": { season: "autumn", icon: "🍂", desc: "秋季的開始，暑氣漸退。", detail: "立秋代表炎熱的夏天即將過去。雖然還有「秋老虎」，但早晚空氣開始有了一絲涼意。" },
            "處暑": { season: "autumn", icon: "🌥️", desc: "暑氣結束，天氣轉涼。", detail: "「處」有止的意思。代表炎熱的暑氣到此為止，秋天正式接管大地。" },
            "白露": { season: "autumn", icon: "💧", desc: "清晨草木有白色露珠。", detail: "氣溫下降幅度變大，早晚溫差增加，水氣凝結成白色的露珠。古人說：「白露勿露身」。" },
            "秋分": { season: "autumn", icon: "🌕", desc: "晝夜再等長，秋意漸濃。", detail: "平分了秋季。此後北半球夜長於晝，秋燥也變得明顯，建議多食用滋潤的食物。" },
            "寒露": { season: "autumn", icon: "🧥", desc: "露水轉寒，氣溫更低。", detail: "露水增多，且氣溫更冷，快要凝結成霜。此時是登山遠眺、觀賞紅葉的好時節。" },
            "霜降": { season: "autumn", icon: "❄️", desc: "開始見到霜，寒意明顯。", detail: "秋季的最後一個節氣。氣候轉冷，大地開始出現初霜，象徵秋天即將結束。" },
           "立冬": { season: "winter", icon: "🧤", desc: "冬季的開始，萬物冬藏。", detail: "「冬」有終的意思。農作物已收曬入庫，動物準備冬眠。這也是補冬、食補的好時機。" },
           "小雪": { season: "winter", icon: "🌨️", desc: "氣溫降至零度，偶有飄雪。", detail: "北方開始結合降雪，但規模不大。南方則進入明顯的乾冷季節。民間開始醃製臘肉。" },
            "大雪": { season: "winter", icon: "☃️", desc: "降雪範圍擴大，積雪變厚。", detail: "此時天氣更冷，降雪機會增加。是進補的好時機，也要注意頭部與腳部的保塊。" },
           "冬至": { season: "winter", icon: "🍡", desc: "一年中黑夜最長的一天。", detail: "太陽直射南回歸線。民間有「冬至大如年」的說法，台灣人習慣在這天吃湯圓、補冬。" },
            "小寒": { season: "winter", icon: "🧊", desc: "氣候進入寒冷季節。", detail: "雖然名為「小寒」，但在許多地區，這段時間往往比「大寒」還要寒冷。" },
            "大寒": { season: "winter", icon: "🏔️", desc: "一年中最冷的尾聲。", detail: "二十四節氣的最後一個。此時正值歲末，充滿了迎接春節、除舊佈新的忙碌氣氛。" }
        };

        const termOrder = [
            "小寒", "大寒", "立春", "雨水", "驚蟄", "春分", "清明", "穀雨",
            "立夏", "小滿", "芒種", "夏至", "小暑", "大暑", "立秋", "處暑",
            "白露", "秋分", "寒露", "霜降", "立冬", "小雪", "大雪", "冬至"
        ];

        let currentYear = new Date().getFullYear();
        let computedSolarTerms = [];
        let cloudDataStore = {};
        
        let touchState = {
            scale: 1,
            lastScale: 1,
            initialDistance: 0,
            touchStartY: 0,
            isPinching: false,
            throttle: false
        };

        function updateTodayInfo() {
            if (typeof Solar === 'undefined') {
                setTimeout(updateTodayInfo, 100);
                return;
            }
            try {
                const now = new Date();
                const solar = Solar.fromDate(now);
                const lunar = solar.getLunar();
                const solarStr = `${solar.getYear()}年${solar.getMonth()}月${solar.getDay()}日 (${solar.getWeekInChinese()})`;
                const lunarStr = `農曆 ${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
                const gzYear = lunar.getYearInGanZhi();
                const gzMonth = lunar.getMonthInGanZhi();
                const gzDay = lunar.getDayInGanZhi();
                const gzFullStr = `${gzYear}年 ${gzMonth}月 ${gzDay}日`;

                document.getElementById('gregorianDate').innerText = solarStr;
                // 手機放大至 text-base (16px)，電腦維持原始 md:text-sm (14px)
                document.getElementById('lunarAndStems').innerHTML = `${lunarStr}<br><span class="text-base md:text-sm text-stone-700 font-bold mt-1 inline-block">${gzFullStr}</span>`;
            } catch (e) {
                console.error("日期計算出錯", e);
            }
        }

        function parseICS(text) {
            const data = {};
            const events = text.split("BEGIN:VEVENT");
            events.forEach(evt => {
                const summaryMatch = evt.match(/SUMMARY:(.+)/);
                const dateMatch = evt.match(/DTSTART;VALUE=DATE:(\d{4})(\d{2})(\d{2})/);
                if (summaryMatch && dateMatch) {
                    const name = summaryMatch[1].trim();
                    const year = parseInt(dateMatch[1]);
                    const month = parseInt(dateMatch[2]);
                    const day = parseInt(dateMatch[3]);
                    if (!data[year]) data[year] = {};
                    data[year][name] = { month, day };
                }
            });
            return data;
        }

        function getTermDate(year, termName) {
            // 1. 先從雲端 ICS 資料中查找
            if (cloudDataStore[year] && cloudDataStore[year][termName]) {
                const d = cloudDataStore[year][termName];
                return { month: d.month, day: d.day };
            }
            // 2. 修正：使用 getJieQiTable 並處理繁簡名稱對照，確保能正確抓到陽曆年份的節氣
            try {
                // 部分節氣繁簡名稱在 JS 庫中鍵值不同
                const t2s = { '驚蟄': '惊蛰', '穀雨': '谷雨', '小滿': '小满', '芒種': '芒种', '處暑': '处暑' };
                const searchName = t2s[termName] || termName;
                
                // 檢查年初、年中、年尾的農曆節氣表，以涵蓋整年陽曆節氣
                const checkMonths = [1, 6, 12];
                for (let m of checkMonths) {
                    const table = Solar.fromYmd(year, m, 1).getLunar().getJieQiTable();
                    const targetSolar = table[searchName];
                    if (targetSolar && targetSolar.getYear() === year) {
                        return { month: targetSolar.getMonth(), day: targetSolar.getDay() };
                    }
                }
            } catch (e) {
                console.error("節氣計算失敗:", termName, e);
            }
            // 3. 失敗時的最後保底
            return { month: 1, day: 1 };
        }

        async function fetchCloudDataAndInit() {
            document.getElementById('loadingIndicator').classList.remove('hidden');
            try {
                const res = await fetch(ICS_URL);
                if (res.ok) {
                    const text = await res.text();
                    cloudDataStore = parseICS(text);
                }
            } catch (err) {
                console.warn("雲端同步受限");
            } finally {
                document.getElementById('loadingIndicator').classList.add('hidden');
                initAndRender();
            }
        }

        function initTermsData(year) {
            computedSolarTerms = termOrder.map(name => {
                const dateInfo = getTermDate(year, name);
                const info = solarTermsInfo[name];
                return {
                    name, month: dateInfo.month, computedDay: dateInfo.day,
                    season: info.season, icon: info.icon, desc: info.desc, detail: info.detail,
                    formattedDate: `${dateInfo.month}月${dateInfo.day}日`
                };
            });
        }

        /** 修正後的判斷邏輯 **/
        function getCurrentTermName() {
            const now = new Date();
            const month = now.getMonth() + 1, day = now.getDate();
            // 將今日日期轉換為比較數值 (例如 1月8日 = 108)
            const todayVal = month * 100 + day;
            
            // 預設為最後一個節氣（冬至），處理 1 月初還沒到「小寒」的情況
            let active = computedSolarTerms[computedSolarTerms.length - 1]; 
            
            for (const t of computedSolarTerms) {
                const tVal = t.month * 100 + t.computedDay;
                // 如果今天日期大於等於節氣日期，暫時設定為該節氣
                if (todayVal >= tVal) {
                    active = t;
                } else {
                    // 一旦遇到第一個日期還沒到的節氣，就跳出，保留最後一個符合的結果
                    break;
                }
            }
            return active.name;
        }

        function handleYearChange() {
            const input = document.getElementById('yearInput');
            let val = parseInt(input.value);
            if (isNaN(val)) return;
            val = Math.max(1901, Math.min(2100, val));
            input.value = val;
            currentYear = val;
            initAndRender();
        }

        function getSeasonName(s) {
            const names = { spring: '春', summer: '夏', autumn: '秋', winter: '冬' };
            return names[s] || '';
        }

        function renderTerms(data, activeTermName = null) {
            const grid = document.getElementById('termsGrid');
            grid.innerHTML = '';
            const activeName = activeTermName || getCurrentTermName();
            data.forEach((term) => {
                const isToday = term.name === activeName;
                const card = document.createElement('div');
                card.className = `term-card bg-white p-6 rounded-2xl shadow-md cursor-pointer season-${term.season} ${isToday ? 'current-term-border scale-105 shadow-xl' : ''}`;
                card.onclick = () => openModal(term);
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="text-4xl">${term.icon}</div>
                        ${isToday ? '<span class="bg-stone-800 text-white text-[10px] px-2 py-0.5 rounded-full font-bold tracking-widest animate-pulse shadow-sm">當季</span>' : ''}
                    </div>
                    <h3 class="text-2xl font-bold serif-font mb-2 text-stone-800 leading-tight">${term.name}</h3>
                                        <p class="text-stone-500 text-base sm:text-sm mb-3 font-mono leading-none">${currentYear} · ${term.formattedDate}</p>
                    <p class="text-stone-600 line-clamp-2 text-base sm:text-sm leading-relaxed">${term.desc}</p>
                    <div class="mt-4 text-stone-400 text-xs font-bold uppercase tracking-wider">
                        ${getSeasonName(term.season)} 季
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterSeason(season) {
            if (season === 'all') initAndRender();
            else renderTerms(computedSolarTerms.filter(t => t.season === season));
        }

        function searchTerms() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderTerms(computedSolarTerms.filter(t => t.name.includes(q) || t.desc.includes(q)));
        }

        function openModal(term) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <div class="flex flex-col items-center mb-8 text-center">
                    <span class="text-6xl mb-4">${term.icon}</span>
                    <h2 class="text-3xl font-bold serif-font text-stone-800 tracking-widest font-bold">${term.name}</h2>
                    <p class="text-stone-400 mt-2 font-mono text-sm font-bold">${currentYear}年 ${term.formattedDate}</p>
                </div>
                <div class="space-y-6 text-sm leading-loose text-stone-700 text-left">
                    <div class="bg-stone-50 p-6 rounded-3xl border border-stone-100">
                        <h4 class="font-bold text-stone-900 border-b border-stone-200 pb-2 mb-3 serif-font text-base tracking-widest text-center">節氣意涵</h4>
                        <p class="font-light text-center">${term.desc}</p>
                    </div>
                 <div class="px-2 text-center">
                        <h4 class="font-bold text-stone-900 border-b border-stone-200 pb-2 mb-3 serif-font text-base tracking-widest">深入探索</h4>
                        <p class="text-stone-600 font-light">${term.detail}</p>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function openCalendar() {
            const modal = document.getElementById('calendarModal');
            const yearSelect = document.getElementById('calYearSelect');
            const monthSelect = document.getElementById('calMonthSelect');
            
            if (yearSelect.options.length === 0) {
                for (let i = 1901; i <= 2100; i++) {
                    const opt = document.createElement('option'); 
                    opt.value = i; 
                    const tempLunar = Solar.fromYmd(i, 6, 1).getLunar();
                    opt.text = `${i} ${tempLunar.getYearInGanZhi()}年`;
                    yearSelect.appendChild(opt);
                }
                for (let i = 1; i <= 12; i++) {
                    const opt = document.createElement('option'); opt.value = i; opt.text = i;
                    monthSelect.appendChild(opt);
                }
            }
            
            const now = new Date();
            yearSelect.value = now.getFullYear();
            monthSelect.value = now.getMonth() + 1;
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            resetZoom();
            renderCalendarContent();

            const calContent = document.getElementById('calendarContent');
            const scrollWrapper = document.getElementById('calendarScrollWrapper');

            scrollWrapper.onwheel = (e) => {
                if (e.ctrlKey) {
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? -0.1 : 0.1;
                    applyZoom(touchState.scale + delta);
                } else if (touchState.scale === 1) {
                    e.preventDefault();
                    changeCalendarMonth(e.deltaY > 0 ? 1 : -1);
                }
            };

            calContent.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    touchState.isPinching = true;
                    touchState.initialDistance = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                } else {
                    touchState.isPinching = false;
                    touchState.touchStartY = e.touches[0].pageY;
                }
            }, { passive: false });

            calContent.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && touchState.isPinching) {
                    e.preventDefault();
                    const currentDistance = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    const zoomFactor = currentDistance / touchState.initialDistance;
                    applyZoom(touchState.lastScale * zoomFactor);
                }
            }, { passive: false });

            calContent.addEventListener('touchend', (e) => {
                if (touchState.isPinching) {
                    touchState.lastScale = touchState.scale;
                    touchState.isPinching = false;
                } else if (touchState.scale === 1) {
                    let touchEndY = e.changedTouches[0].pageY;
                    const threshold = 50; 
                    if (touchEndY < touchState.touchStartY - threshold) changeCalendarMonth(1); 
                    if (touchEndY > touchState.touchStartY + threshold) changeCalendarMonth(-1); 
                }
            }, { passive: true });
        }

        function applyZoom(newScale) {
            touchState.scale = Math.min(Math.max(1, newScale), 3);
            const content = document.getElementById('calendarContent');
            content.style.transform = `scale(${touchState.scale})`;
            content.style.width = (100 * touchState.scale) + "%";
            if (touchState.scale <= 1) {
                content.style.width = "100%";
                content.style.transform = "scale(1)";
            }
        }

        function resetZoom() {
            touchState.scale = 1;
            touchState.lastScale = 1;
            applyZoom(1);
        }

        function changeCalendarMonth(offset) {
            if (touchState.throttle) return;
            const yearSelect = document.getElementById('calYearSelect');
            const monthSelect = document.getElementById('calMonthSelect');
            let year = parseInt(yearSelect.value);
            let month = parseInt(monthSelect.value);
            month += offset;
            if (month > 12) { month = 1; year++; }
            else if (month < 1) { month = 12; year--; }
            if (year >= 1901 && year <= 2100) {
                yearSelect.value = year; monthSelect.value = month;
                renderCalendarContent();
                touchState.throttle = true;
                setTimeout(() => { touchState.throttle = false; }, 250);
            }
        }

        function closeCalendar() {
            document.getElementById('calendarModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        const traditionalJieQiMap = { '惊蛰': '驚蟄', '谷雨': '穀雨', '芒种': '芒種', '处暑': '處暑' };

        function renderCalendarContent() {
            const year = parseInt(document.getElementById('calYearSelect').value);
            const month = parseInt(document.getElementById('calMonthSelect').value);
            const container = document.getElementById('calendarContent');
            const firstDay = new Date(year, month - 1, 1).getDay();
            const daysInMonth = new Date(year, month, 0).getDate();
            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && (today.getMonth() + 1) === month;
            
            let html = `
                                <div class="calendar-grid-header text-sm md:text-sm mb-1 md:mb-1 uppercase tracking-wider shrink-0">
                    <div class="py-1 text-red-600 font-black">日</div><div class="py-1">一</div><div class="py-1">二</div>
                    <div class="py-1">三</div><div class="py-1">四</div><div class="py-1">五</div>
                    <div class="py-1 text-stone-800 font-bold">六</div>
                </div>
                <div class="calendar-grid-body rounded-2xl md:rounded-[4rem] overflow-hidden bg-white">
            `;
            
            for (let i = 0; i < firstDay; i++) html += `<div class="calendar-day bg-stone-50/20"></div>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const sol = Solar.fromYmd(year, month, d);
                const lun = sol.getLunar();
                const isToday = isCurrentMonth && today.getDate() === d;
                const lunarRow = `${lun.getMonthInChinese()}月${lun.getDayInChinese()}`;
                const gzMonth = `${lun.getMonthInGanZhi()}月`;
                const gzDay = `${lun.getDayInGanZhi()}日`;
                const jieQi = lun.getJieQi();
                const displayJieQi = traditionalJieQiMap[jieQi] || jieQi;
                
                html += `
                    <div class="calendar-day group hover:bg-stone-50 transition-all overflow-hidden border-b border-r border-stone-100 text-center">
                                                <span class="${isToday ? 'is-today-circle' : 'text-stone-900 font-black'} text-lg md:text-sm leading-none">${d}</span>
                        <div class="flex flex-col items-center mt-0.5 md:mt-0 text-center leading-tight">
                                                            <span class="text-[11px] md:text-[9px] text-stone-900 font-bold px-1 whitespace-nowrap">${lunarRow}</span>
                            
                                                            <div class="flex flex-col md:flex-row md:flex-nowrap items-center justify-center md:gap-0.5 mt-0.5 md:mt-0 leading-none">
                                                                <span class="text-[10px] md:text-[8px] text-stone-700 font-bold whitespace-nowrap">${gzMonth}</span>
                                <span class="text-[10px] md:text-[8px] text-stone-700 font-bold whitespace-nowrap">${gzDay}</span>
                            </div>
                        </div>
                        ${displayJieQi ? `<span class="jie-qi-tag">${displayJieQi}</span>` : ''}
                    </div>
                `;
            }
            const totalCells = firstDay + daysInMonth;
            const remaining = (42 - totalCells); 
            for (let i = 0; i < remaining; i++) html += `<div class="calendar-day bg-stone-50/20"></div>`;
            html += `</div>`;
            container.innerHTML = html;
        }

        function initAndRender() {
            initTermsData(currentYear);
            const active = getCurrentTermName();
            const idx = computedSolarTerms.findIndex(t => t.name === active);
            const sorted = [...computedSolarTerms.slice(idx), ...computedSolarTerms.slice(0, idx)];
            renderTerms(sorted, active);
        }

        window.onload = () => {
            document.getElementById('yearInput').value = currentYear;
            updateTodayInfo();
            fetchCloudDataAndInit();
        };

        window.onclick = (e) => { 
            if (e.target.id === 'modal') closeModal(); 
            if (e.target.id === 'calendarModal') closeCalendar();
        }
    </script>
</body>
</html>
